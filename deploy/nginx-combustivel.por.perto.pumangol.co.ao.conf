# Combustível por Perto — Nginx (proxy inverso com HTTPS)
# Copiar para /etc/nginx/sites-available/ e activar; ajustar os caminhos do certificado.
# Os cabeçalhos de segurança (CSP, HSTS, etc.) são enviados pelo próprio portal: não os repita aqui.

server {
    listen 80;
    # listen [::]:80;             # activar se o servidor tiver IPv6
    server_name combustivel.por.perto.pumangol.co.ao;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;  # activar se o servidor tiver IPv6
    server_name combustivel.por.perto.pumangol.co.ao;

    ssl_certificate     /etc/letsencrypt/live/combustivel.por.perto.pumangol.co.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/combustivel.por.perto.pumangol.co.ao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;

    # Tempo real (Server-Sent Events): sem buffer e com ligação longa
    location /api/eventos {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
